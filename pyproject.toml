[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailab-ops-copilot"
version = "0.1.0"
description = "A teaching-grade, simulated enterprise AIOps copilot: diagnose failed training/eval jobs from synthetic platform data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AILab Ops Copilot Contributors" }]
keywords = ["aiops", "llm-agent", "rag", "tool-calling", "teaching", "synthetic-data"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
ailab-ops = "ailab_ops.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ailab_ops = ["datagen/*.yaml", "serving/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
