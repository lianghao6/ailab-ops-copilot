[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailab-ops-copilot"
version = "0.1.0"
description = "Enterprise AIOps copilot for training and evaluation platforms: diagnose why a job failed, from job records, logs and metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AILab Ops Copilot Contributors" }]
keywords = ["aiops", "llm-agent", "rag", "tool-calling", "observability", "agent"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
ailab-ops = "ailab_ops.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ailab_ops = [
    "datagen/*.yaml",
    "serving/static/*.html",
    "serving/static/v2/*.html",
    "serving/static/v2/*.css",
    "serving/static/v2/*.js",
]

# Independent source assets are included in distributions without copying them
# into the Python package. Non-editable deployments supply their data/v2 root.
[tool.setuptools.data-files]
"ailab_ops/data/v2/cases" = ["data/v2/cases/*.json"]
"ailab_ops/data/v2/knowledge/runbooks" = ["data/v2/knowledge/runbooks/*.md"]
"ailab_ops/data/v2/evals" = ["data/v2/evals/*.jsonl"]
"ailab_ops/data/v2/replays" = ["data/v2/replays/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
